<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin Conexión | Las Manitos de Mili</title>
  <meta name="theme-color" content="#fdfaf6">
  <link rel="icon" href="/favicon.ico">
  <style>
    :root {
      --bg-primary: #fdfaf6;
      --accent-rose: #dcae96;
      --accent-gold: #c5a880;
      --text-dark: #2c2220;
      --text-muted: #6e5e5b;
      --white: #ffffff;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-primary);
      color: var(--text-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(197, 168, 128, 0.3);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(44, 34, 32, 0.08);
      animation: fadeIn 0.5s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      margin: 0 auto 20px;
      box-shadow: 0 4px 16px rgba(44, 34, 32, 0.08);
      border: 2px solid var(--accent-rose);
      object-fit: cover;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 12px;
      color: var(--text-dark);
      font-weight: 600;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      background-color: var(--text-dark);
      color: var(--white);
      text-decoration: none;
      border-radius: 50px;
      font-weight: 500;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-bottom: 12px;
    }
    .btn:active {
      opacity: 0.85;
    }
    .btn-secondary {
      background-color: transparent;
      color: var(--text-dark);
      border: 1px solid rgba(44, 34, 32, 0.2);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: #f6eee5;
      color: #946853;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-bottom: 16px;
      font-weight: 500;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #cb7870;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192x192.png" alt="Las Manitos de Mili" class="logo">
    <div class="status-badge">
      <span class="status-dot"></span> Modo sin conexión
    </div>
    <h1>¡Hola! Parece que estás sin conexión</h1>
    <p>No pudimos conectarnos a internet en este momento. Podés reintentar cuando recuperes señal o escribirle directamente a Mili.</p>
    <button class="btn" onclick="window.location.reload()">Reintentar conexión</button>
    <a href="https://wa.me/5493413022674" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">Contactar por WhatsApp</a>
  </div>
</body>
</html>
